    <script>
      // Gracefully prevent Vite HMR WebSocket connection loop in preview environments
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = typeof url === 'string' ? url : (url && url.href ? url.href : '');
            var isViteHmr =
              urlStr.indexOf('@vite') !== -1 ||
              urlStr.indexOf('/@vite/client') !== -1 ||
              urlStr.indexOf('vite-hmr') !== -1 ||
              (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var dummy = {
                readyState: 3,
                bufferedAmount: 0,
                protocol: 'vite-hmr',
                url: urlStr,
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function() {
                if (dummy.onclose) dummy.onclose({ wasClean: true, code: 1000, reason: 'HMR disabled in preview' });
              }, 0);
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>
